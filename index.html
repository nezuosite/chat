<!-- 🔒 ローカル起動のゼロ秒完全遮断 -->
<script>
(function() {
  var host = window.location.hostname;
  var protocol = window.location.protocol;
  var isLocal = (
    protocol === "file:" ||
    host === "localhost" ||
    host === "127.0.0.1" ||
    host === "0.0.0.0" ||
    (host && host.endsWith(".local"))
  );

  if (isLocal) {
    window.__IS_BLOCKED__ = true;
    var s = document.createElement("style");
    s.textContent = "html,body{background:#05070a!important;overflow:hidden!important;}#app,.mod-overlay,#toastContainer{display:none!important;}#localBlockOverlay{display:flex!important;}";
    document.head.appendChild(s);
  }
})();
</script>

<script>
(function() {
  if (window.__IS_BLOCKED__) return;
  try {
    var isJoined = localStorage.getItem("nz_is_joined") === "true";
    var lastRoom = localStorage.getItem("nz_last_room_id");
    var sessStart = parseInt(localStorage.getItem("nz_session_start_time") || "0", 10);
    var lastPost = parseInt(localStorage.getItem("nz_last_post_time") || "0", 10);
    var base = Math.max(sessStart, lastPost);
    var savedMins = parseInt(localStorage.getItem("nz_auto_exit_minutes") || "30", 10);
    var exitMs = (isNaN(savedMins) || savedMins <= 0 ? 30 : savedMins) * 60 * 1000;
    var hasInvite = window.location.hash && window.location.hash.length > 1;
    if (isJoined && lastRoom && !hasInvite && (Date.now() - base < exitMs)) {
      document.documentElement.classList.add("preload-chat-active");
      window.__PRELOAD_ROOM_ID__ = lastRoom;
    }
  } catch (e) {}
})();
</script>

 try {

  const firebaseConfig = {

  const $ = id => document.getElementById(id);

  let activeKey = null;
  const unreadMsgIds = new Set();

  const E2EE = {
    hasCrypto: (typeof window !== 'undefined' && window.crypto && window.crypto.subtle),
    keyCache: new Map(),
    async deriveKey(passcode) {
      if (!passcode) return null;
      if (this.keyCache.has(passcode)) return this.keyCache.get(passcode);
      if (!this.hasCrypto) return null;
      try {
        const passData = _txtEnc.encode(passcode.normalize('NFKC'));
        const hash = await crypto.subtle.digest("SHA-256", passData);
        const key = await crypto.subtle.importKey("raw", hash, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
        this.keyCache.set(passcode, key);
        return key;
      } catch (e) { return null; }
    },
    async encrypt(text, key) {
      if (!text) return "";
      if (!key || !this.hasCrypto) return "[PLAIN]::" + text;
      try {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, _txtEnc.encode(text));
        const combined = new Uint8Array(12 + encrypted.byteLength);
        combined.set(iv); combined.set(new Uint8Array(encrypted), 12);
        return btoa(String.fromCharCode.apply(null, combined));
      } catch (e) { return "[PLAIN]::" + text; }
    },
    async decrypt(base64Text, key) {
      if (!base64Text) return "";
      if (base64Text.startsWith("[PLAIN]::")) return base64Text.substring(9);
      if (!key || !this.hasCrypto) return base64Text;
      let combined;

        const binary = atob(base64Text);

      if (combined.length < 28) return base64Text;
      try {
        const iv = combined.slice(0, 12);
        const ciphertext = combined.slice(12);
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
        return _txtDec.decode(decrypted);
      } catch (e) { return base64Text; }
    }

  const escapeHtml = str => typeof str !== "string" ? "" : str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));

  const fDT = (ts) => {
    if (!ts || typeof ts !== "number") return "--:--:--";
    const d = new Date(ts);
    if (isNaN(d.getTime())) return "--:--:--";
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}(${["日", "月", "火", "水", "木", "金", "土"][d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };

  window.sha256 = async (str) => {
    if (E2EE.hasCrypto) {
      try {
        const buf = _txtEnc.encode(str);
        const hash = await window.crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {}
    }
    let h1 = 0x811c9dc5, h2 = 0xcbf29ce4;
    for (let i = 0; i < str.length; i++) {
      h1 = Math.imul(h1 ^ str.charCodeAt(i), 0x01000193);
      h2 = Math.imul(h2 ^ str.charCodeAt(i), 0x01000193);
    }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
  };

  // 🔒 トリップ生成（正規UIDから確定計算）
  window.makeTripFromUid = async (uid) => {

    if (cached && cached !== "◆000000" && cached !== "◆error") {
      myTrip = cached;
      return cached;
    }

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1500);

      const res = await fetch(`${AUTH_WORKER_URL}/trip`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (res.ok) {
        const data = await res.json();
        if (data && data.trip && data.trip !== "◆error") {
          myTrip = data.trip;
          safeLS.set(cacheKey, myTrip);
          isMyTripAdmin = !!data.isAdmin;
          return data.trip;
        }
      }
    } catch (e) {}

    const localHash = await window.sha256(uid + ":NEZUO_FIXED_SALT_2026");
    myTrip = "◆" + localHash.substring(0, 6);
    safeLS.set(cacheKey, myTrip);
    return myTrip;
  };

  let exitWorker = null;
  const exitingUsersLock = new Set();

  function initExitWorker() {
    if (exitWorker || typeof Worker === "undefined" || typeof Blob === "undefined") return;
    try {
      const blob = new Blob([`
        let timer = null;
        self.onmessage = function(e) {
          if (e.data === 'start') {
            if (!timer) timer = setInterval(function() { self.postMessage('tick'); }, 50);
          } else if (e.data === 'stop') {
            if (timer) { clearInterval(timer); timer = null; }
          }
        };
      `], { type: 'application/javascript' });
      exitWorker = new Worker(URL.createObjectURL(blob));
      exitWorker.onmessage = function() { checkAndTriggerExactAutoExit(); };
    } catch (e) { exitWorker = null; }
  }

  let fallbackIntervalId = null;
  function startSmartAutoExitChecker() {
    initExitWorker();
    if (exitWorker) {
      exitWorker.postMessage('start');
    } else {
      if (fallbackIntervalId) clearInterval(fallbackIntervalId);
      fallbackIntervalId = setInterval(checkAndTriggerExactAutoExit, 50);
    }
  }

  function stopSmartAutoExitChecker() {
    if (exitWorker) exitWorker.postMessage('stop');
    if (fallbackIntervalId) { clearInterval(fallbackIntervalId); fallbackIntervalId = null; }
    exitingUsersLock.clear();
  }

  async function triggerSelfAutoExit() {
    if (isExecutingAutoExit || !isJoined || !db || !currentRoomId || !myUid) return;
    isExecutingAutoExit = true;
    stopSmartAutoExitChecker();

    const roomId = currentRoomId;
    const cleanName = (myName || "").trim();
    const cleanTrip = myTrip || "";
    const exactExpiryTime = myLastActiveTs + AUTO_EXIT_MS;

    try {
      if (cleanName) {
        const rawSysText = "📢 [お知らせ] " + `${cleanName} ${cleanTrip}`.trim() + ` が自動退室しました (${autoExitMinutes}分間発言がなかったため)`;
        const encD = await encodeMsgPayload("システム", "", rawSysText);
        await db.ref(`chat/${roomId}`).push({
          u: "system", c: "#f43f5e", d: encD, t: exactExpiryTime, sys: true
        });
      }
      await db.ref(`presence/${roomId}/${myUid}`).remove().catch(() => {});
    } catch (e) {
    } finally {
      doExit(true, false);
      isExecutingAutoExit = false;
    }
  }

  async function checkAndTriggerExactAutoExit() {
    if (!isJoined || !db || !currentRoomId || isExecutingAutoExit) return;
    const nowTrue = getTrueTime();
    const roomId = currentRoomId;

    if (myLastActiveTs > 0 && (nowTrue >= myLastActiveTs + AUTO_EXIT_MS)) {
      await triggerSelfAutoExit();
      return;
    }

    const isMeActive = (myLastActiveTs > 0 && (nowTrue < myLastActiveTs + AUTO_EXIT_MS));
    if (!isMeActive) return;

    const expiredList = Object.entries(rawPresenceMap).filter(([id, u]) => {
      return id !== myUid && u && typeof u.t === "number" && (nowTrue >= u.t + AUTO_EXIT_MS) && !exitingUsersLock.has(id);
    });

    if (expiredList.length === 0) return;

    expiredList.forEach(([id]) => exitingUsersLock.add(id));

    await Promise.all(expiredList.map(async ([id, u]) => {
      const pRef = db.ref(`presence/${roomId}/${id}`);
      try {
        const result = await pRef.transaction((currentData) => {
          if (currentData !== null && (getTrueTime() >= currentData.t + AUTO_EXIT_MS)) {
            return null;
          }
          return undefined;
        });

        if (result.committed && result.snapshot.val() === null) {
          const userName = (u.n || "").trim();
          const userTrip = (u.p || "").trim();
          if (userName) {
            const exactExpiryTime = u.t + AUTO_EXIT_MS;
            const rawSysText = "📢 [お知らせ] " + `${userName} ${userTrip}`.trim() + ` が自動退室しました (${autoExitMinutes}分間発言がなかったため)`;
            const encD = await encodeMsgPayload("システム", "", rawSysText);
            await db.ref(`chat/${roomId}`).push({
              u: "system", c: "#f43f5e", d: encD, t: exactExpiryTime, sys: true
            });
          }
        }
      } catch (e) {
      } finally {
        exitingUsersLock.delete(id);
      }
    }));
  }

    while (D.tli.children.length > MAX_CHAT_LOGS) {

      const mid = firstChild.dataset.mid;
      if (mid) {
        renderedMwNodes.delete(mid);
        displayedMsgIds.delete(mid);
        unreadMsgIds.delete(mid);

      firstChild.remove();

  let isDiffSyncing = false;
  async function syncIncrementalDiff() {
    if (!isJoined || !currentRoomId || !db || isDiffSyncing || isFirstLoad) return;
    isDiffSyncing = true;
    try {
      db.goOnline();
      const roomId = currentRoomId;

      const [settingsSnap, presSnap, chatSnap] = await Promise.all([
        db.ref(`settings/${roomId}`).once("value"),
        db.ref(`presence/${roomId}`).once("value"),
        db.ref(`chat/${roomId}`).limitToLast(MAX_CHAT_LOGS).once("value"),
        syncServerOffset()
      ]);

      const sVal = settingsSnap.val() || {};
      const serverClearTime = sVal.last_cleared_at || 0;

      if (serverClearTime > localLastClearedTime) {
        localLastClearedTime = serverClearTime;
        clearChatUIOnly();
        latestDisplayedTs = serverClearTime;
      }

      handlePresenceUpdate(presSnap.val() || {});
      checkAndTriggerExactAutoExit();

      const serverKeys = new Set();
      const rawCandidates = [];
      chatSnap.forEach(child => {
        serverKeys.add(child.key);
        const m = child.val();
        if (m) {
          m.id = child.key;
          if (!displayedMsgIds.has(m.id) && !processingMsgIds.has(m.id)) {
            rawCandidates.push(m);
          }
        }
      });

      if (rawCandidates.length > 0) {
        rawCandidates.forEach(m => processingMsgIds.add(m.id));
        await Promise.all(rawCandidates.map(m => decodeMsgPayload(m)));
        rawCandidates.sort((a, b) => {
          const diff = getMsgTime(a) - getMsgTime(b);
          return diff !== 0 ? diff : a.id.localeCompare(b.id);
        });

        const acc = $("adminAccordion");
        const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 80;
        const isAtBottom = D.tl && (D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance);

        rawCandidates.forEach(m => {
          processingMsgIds.delete(m.id);
          if (displayedMsgIds.has(m.id)) return;
          const el = cMsg(m, false);
          insertMessageInOrder(el);
          const msgTime = getMsgTime(m);
          if (msgTime > latestDisplayedTs) latestDisplayedTs = msgTime;
          if (m.u !== myUid && m.u !== "system" && !m.sys && !isAtBottom) {
            unreadMsgIds.add(m.id);
          }
        });

        pruneOldMessages();
        if (isAtBottom) { scBottom(true); unreadMsgIds.clear(); }
        updateUnreadBadge();
        updateJumpBtns();
      }

      lastSyncAt = getTrueTime();
    } catch (e) {
    } finally {
      isDiffSyncing = false;
    }

  function updateSkyWayParticipantsUI() {
    if (!skywayRoomInstance) return;
    const list = {};
    skywayRoomInstance.members.forEach(m => {
      let meta = {};
      try { meta = JSON.parse(m.metadata || "{}"); } catch(e){}
      list[m.id] = { n: m.name, p: meta.trip || "", c: meta.color || "#fff", mode: meta.mode || "both", muted: meta.muted || false };
    });
    renderCallParticipants(list);
  }

  async function startCall(mode) {
    if (!isJoined || !currentRoomId || callState.active || globalCallsDisabled) return;
    if (!isCallSupported()) {
      alert("お使いのブラウザは音声通話に対応していません。");
      return;
    }

    try {
      const res = await fetch(`${AUTH_WORKER_URL}/token`);
      if (!res.ok) throw new Error("認証サーバーからのトークン取得に失敗しました");
      const { token } = await res.json();

      const roomLib = (typeof skyway_room !== "undefined") ? skyway_room : null;
      if (!roomLib) throw new Error("SkyWay Room SDKが読み込まれていません");

      skywayContext = await roomLib.SkyWayContext.Create(token);
      skywayRoomInstance = await roomLib.SkyWayRoom.FindOrCreate(skywayContext, {
        type: "sfu",
        name: currentRoomId
      });

      skywayMe = await skywayRoomInstance.join({
        name: myName || "名無し",
        metadata: JSON.stringify({ uid: myUid, trip: myTrip, color: curColor, mode, muted: false })
      });

      callState.active = true;
      callState.mode = mode;
      callState.muted = false;
      renderCallBar();

      if (mode === "both") {
        localAudioStream = await roomLib.SkyWayStreamFactory.createMicrophoneAudioStream(CALL_AUDIO_CONSTRAINTS.audio);
        localPublication = await skywayMe.publish(localAudioStream);
      }

      const subscribeAndPlay = async (publication) => {
        if (!skywayMe || publication.publisher.id === skywayMe.id) return;
        if (publication.contentType !== "audio") return;

        const { stream } = await skywayMe.subscribe(publication.id);
        let audioEl = document.querySelector(`audio[data-publisher-id="${publication.publisher.id}"]`);
        if (!audioEl) {
          audioEl = document.createElement("audio");
          audioEl.autoplay = true;
          audioEl.playsInline = true;
          audioEl.dataset.publisherId = publication.publisher.id;
          document.body.appendChild(audioEl);
        }
        stream.attach(audioEl);
      };

      skywayRoomInstance.publications.forEach(subscribeAndPlay);
      skywayRoomInstance.onStreamPublished.add((e) => subscribeAndPlay(e.publication));

      skywayRoomInstance.onMemberLeft.add((e) => {
        document.querySelectorAll(`audio[data-publisher-id="${e.member.id}"]`).forEach(el => el.remove());
        updateSkyWayParticipantsUI();
      });

      skywayRoomInstance.onMemberJoined.add(() => updateSkyWayParticipantsUI());
      updateSkyWayParticipantsUI();

      if (db && currentRoomId && myUid) {
        const myCallRef = db.ref(`calls/${currentRoomId}/participants/${myUid}`);
        await myCallRef.set({ n: myName || "名無し", p: myTrip, c: curColor, mode, muted: false });
        myCallRef.onDisconnect().remove();
      }
    } catch (err) {
      console.error("SkyWay SFU通話開始エラー:", err);
      alert("通話接続に失敗しました: " + (err.message || err));
      await leaveCall();
    }
  }

  async function switchCallMode() {
    if (!callState.active || !skywayMe || !skywayRoomInstance) return;
    const roomLib = (typeof skyway_room !== "undefined") ? skyway_room : null;

    if (callState.mode === "both") {
      if (localPublication) {
        await skywayMe.unpublish(localPublication.id).catch(()=>{});
        localPublication = null;
      }
      if (localAudioStream) {
        if (localAudioStream.track) localAudioStream.track.stop();
        localAudioStream = null;
      }
      callState.mode = "listen";
      callState.muted = false;
    } else {
      try {
        if (roomLib) {
          localAudioStream = await roomLib.SkyWayStreamFactory.createMicrophoneAudioStream(CALL_AUDIO_CONSTRAINTS.audio);
          localPublication = await skywayMe.publish(localAudioStream);
        }
        callState.mode = "both";
        callState.muted = false;
      } catch (err) {
        alert("マイクの起動に失敗しました。");
        return;
      }
    }

    await skywayMe.updateMetadata(JSON.stringify({ uid: myUid, trip: myTrip, color: curColor, mode: callState.mode, muted: false })).catch(()=>{});
    if (db && currentRoomId && myUid) {
      await db.ref(`calls/${currentRoomId}/participants/${myUid}`).update({ mode: callState.mode, muted: false }).catch(()=>{});
    }
    renderCallBar();
    updateSkyWayParticipantsUI();
  }

  function toggleMute() {
    if (!callState.active || callState.mode !== "both" || !localAudioStream || !skywayMe) return;
    callState.muted = !callState.muted;
    if (localAudioStream.track) {
      localAudioStream.track.enabled = !callState.muted;
    }
    skywayMe.updateMetadata(JSON.stringify({ uid: myUid, trip: myTrip, color: curColor, mode: callState.mode, muted: callState.muted })).catch(()=>{});
    if (db && currentRoomId && myUid) {
      db.ref(`calls/${currentRoomId}/participants/${myUid}/muted`).set(callState.muted).catch(() => {});
    }
    renderCallBar();
    updateSkyWayParticipantsUI();
  }

  async function leaveCall() {
    if (!callState.active && !skywayRoomInstance) return;

    document.querySelectorAll("audio[data-publisher-id]").forEach(el => el.remove());

    if (localPublication && skywayMe) {
      try { await skywayMe.unpublish(localPublication.id); } catch(e){}
      localPublication = null;
    }
    if (localAudioStream) {
      try { if (localAudioStream.track) localAudioStream.track.stop(); } catch(e){}
      localAudioStream = null;
    }
    if (skywayRoomInstance && skywayMe) {
      try { await skywayRoomInstance.leave(skywayMe); } catch(e){}
      skywayRoomInstance = null;
      skywayMe = null;
    }
    if (skywayContext) {
      try { await skywayContext.dispose(); } catch(e){}
      skywayContext = null;
    }

    if (db && currentRoomId && myUid) {
      try { await db.ref(`calls/${currentRoomId}/participants/${myUid}`).remove(); } catch (e) {}
    }

    callState.active = false;
    callState.mode = null;
    callState.muted = false;
    renderCallBar();
  }

  async function doExit(isAuto = false, isCrossTab = false) {
    await leaveCall();
    const cleanUid = myUid, cleanName = (myName || "").trim(), cleanTrip = myTrip || "", oldRoomId = currentRoomId, wasJoined = isJoined;
    isJoined = false; 
    stopSmartAutoExitChecker(); 
    hasEnteredLogged = false;
    myLastActiveTs = 0;
    safeLS.remove("nz_is_joined"); safeLS.remove("nz_last_post_time"); safeLS.remove("nz_session_start_time"); safeLS.remove("nz_current_room_id");

    if (!isCrossTab) {
      broadcastTabSync("ROOM_EXIT", { isAuto });
    }

    const finishAndClean = async () => {
      if (oldRoomId && db) {
        if (cleanUid) db.ref(`banlist/${oldRoomId}/${cleanUid}`).off("value");
        db.ref(`settings/${oldRoomId}`).off("value");
        if (cleanUid) await db.ref(`presence/${oldRoomId}/${cleanUid}`).remove().catch(()=>{});
      }
      detachFirebaseListeners(); 
      clearChatUIOnly();
      switchScreen("lobby");
      if (D.mi) D.mi.blur();

    if (wasJoined && cleanName && db && !isAuto && !isCrossTab) {
      try {

        const encD = await encodeMsgPayload("システム", "", rawSysText);
        await db.ref(`chat/${oldRoomId}`).push({ u: "system", c: "#f43f5e", d: encD, t: exitTime, sys: true });
      } catch(e) {}
      await finishAndClean();
    } else {
      await finishAndClean();
    }

  async function joinRoom(options = {}) {
    if (!db) { alert("データベースが準備できていません。"); return; }
    let lobbyRoomId = options.roomId || ($("lobbyRoomId") ? $("lobbyRoomId").value.trim() : "");
    let lobbyRoomPass = options.roomPass || ($("lobbyRoomPass") ? $("lobbyRoomPass").value : "");
    if (!lobbyRoomId) { alert("部屋IDを入力してください。"); return; }
    if (lobbyRoomId !== "official" && !lobbyRoomPass) { alert("部屋パスワードを入力してください。"); return; }

    const joinBtn = $("btnJoin");
    if (joinBtn) { joinBtn.disabled = true; joinBtn.textContent = "接続中..."; }

    await ensureAnonAuth().catch(()=>{});
    if (!myUid) {
      myUid = (auth.currentUser && auth.currentUser.uid) || safeLS.get("nz_permanent_uid") || ("usr_" + Math.random().toString(36).substring(2, 10));
      safeLS.set("nz_permanent_uid", myUid);
    }

    const safeRoomPath = (lobbyRoomId === "official") ? "official" : await window.sha256(lobbyRoomId);

    let isBanned = false;
    let settingsSnap = null;
    try {
      const [banSnap, sSnap] = await Promise.all([
        db.ref(`banlist/${safeRoomPath}/${myUid}`).once("value").catch(() => null),
        db.ref(`settings/${safeRoomPath}`).once("value").catch(() => null)
      ]);
      if (banSnap && banSnap.exists() && banSnap.val()) isBanned = true;
      settingsSnap = sSnap;
    } catch (e) {
      if (joinBtn) { joinBtn.disabled = false; joinBtn.textContent = "部屋に入る / 部屋を作る"; }
      switchScreen("lobby");
      alert("データベース接続、または権限エラーです。");
      return;
    }

    if (isBanned) {
      if (joinBtn) { joinBtn.disabled = false; joinBtn.textContent = "部屋に入る / 部屋を作る"; }
      switchScreen("lobby");
      alert("この部屋の管理者により、アクセスが制限されています。");
      return;
    }

    let isNewRoom = false;
    const val = (settingsSnap && settingsSnap.val()) || {};
    roomSettings.newEntriesDisabled = val.newEntriesDisabled || false;
    roomSettings.passcode = val.passcode || "";
    roomSettings.approvedTrips = val.approvedTrips || {};
    roomSettings.creatorUid = val.creatorUid || "";
    localLastClearedTime = val.last_cleared_at || 0;

    if (!settingsSnap || !settingsSnap.exists() || !roomSettings.creatorUid) {
      isNewRoom = true;
      const isGlobalAdmin = checkIsGlobalAdmin();
      roomSettings.creatorUid = (safeRoomPath === "official") ? (isGlobalAdmin ? myUid : "") : myUid;
      try {
        await db.ref(`settings/${safeRoomPath}`).set({
          creatorUid: roomSettings.creatorUid,
          newEntriesDisabled: false,
          passcode: ""
        });
        if (safeRoomPath !== "official") safeLS.set("nz_my_created_room_id", safeRoomPath);
      } catch (e) {
        console.error("部屋作成エラー:", e);
      }
    }

    const hasApprovedTrip = (safeRoomPath === "official" ? checkIsGlobalAdmin() : Object.values(roomSettings.approvedTrips).includes(myTrip));
    const isGlobalAdmin = checkIsGlobalAdmin();
    const isHostOrAdmin = (safeRoomPath === "official" ? isGlobalAdmin : (myUid === roomSettings.creatorUid));

    if (!options.silent && roomSettings.newEntriesDisabled && !hasApprovedTrip && !isHostOrAdmin) {
      if (joinBtn) { joinBtn.disabled = false; joinBtn.textContent = "部屋に入る / 部屋を作る"; }
      switchScreen("lobby");
      alert("現在、新規の入室が制限されています。");
      return;
    }
    if (!options.silent && roomSettings.passcode && !hasApprovedTrip && !isHostOrAdmin) {
      const userPass = prompt("部屋の合言葉を入力してください：");
      if (userPass !== roomSettings.passcode) {
        if (joinBtn) { joinBtn.disabled = false; joinBtn.textContent = "部屋に入る / 部屋を作る"; }
        switchScreen("lobby");
        alert("合言葉が一致しません。");
        return;
      }
    }

    safeLS.set("nz_current_screen", "chat");
    switchScreen("chat", lobbyRoomId, options.silent);

    detachFirebaseListeners();
    clearChatUIOnly();
    isFirstLoad = true;
    currentRoomId = safeRoomPath; 
    currentRoomPass = lobbyRoomPass;

    if (safeRoomPath === "official") {
      activeKey = null;
    } else {
      activeKey = await E2EE.deriveKey(lobbyRoomPass);
    }

    try {
      db.ref(`banlist/${currentRoomId}/${myUid}`).on("value", s => {
        if (s.val() && isJoined) { 
          doExit(false, false);
          showToast("🚫 管理者によりアクセスが制限（BAN）されました。", 2200); 
        }
      });
    } catch (e) {}

    isJoined = true;
    safeLS.set("nz_is_joined", "true"); 
    safeLS.set("nz_last_room_id", lobbyRoomId);
    safeLS.set("nz_last_room_pass", lobbyRoomPass); 
    safeLS.set("nz_current_room_id", currentRoomId);
    
    if (!options.isCrossTab) {
      broadcastTabSync("ROOM_JOIN", { roomId: lobbyRoomId, roomPass: lobbyRoomPass });
    }

    await syncServerOffset();

    const nowTrue = getTrueTime();
    if (options.silent || options.isCrossTab) {
      const prevPost = parseInt(safeLS.get("nz_last_post_time") || "0", 10);
      const prevSess = parseInt(safeLS.get("nz_session_start_time") || "0", 10);
      const prevBase = Math.max(prevPost, prevSess);
      myLastActiveTs = prevBase > 0 ? prevBase : nowTrue;
    } else {
      updateSessionStartTime(nowTrue);
      updateLastPostTime(nowTrue);
    }

    try {
      await db.ref(`presence/${currentRoomId}/${myUid}`).set({
        n: myName || "名無し",
        p: myTrip,
        c: curColor,
        t: firebase.database.ServerValue.TIMESTAMP
      });
    } catch (err) {}

    setupFirebaseListeners();
    startSmartAutoExitChecker();

    if (joinBtn) { joinBtn.disabled = false; joinBtn.textContent = "部屋に入る / 部屋を作る"; }

    const cleanName = (myName || "").trim();
    if (!options.silent && !options.isCrossTab && cleanName && !hasEnteredLogged) {
      hasEnteredLogged = true;
      const enterTs = getTrueTime();
      
      if (isNewRoom && currentRoomId !== "official") {
        const createText = "📢 [お知らせ] " + `${cleanName} ${myTrip}`.trim() + " が部屋を作成しました";
        const encCreate = await encodeMsgPayload("システム", "", createText);
        await db.ref(`chat/${currentRoomId}`).push({ u: "system", c: "#f43f5e", d: encCreate, t: enterTs - 10, sys: true });
      }

      const rawEnterText = "📢 [お知らせ] " + `${cleanName} ${myTrip}`.trim() + " が入室しました";
      encodeMsgPayload("システム", "", rawEnterText).then(encEnter => {
        db.ref(`chat/${currentRoomId}`).push({ u: "system", c: "#f43f5e", d: encEnter, t: enterTs, sys: true }).catch(()=>{});
      });
    }

    applyRoomSettingsUI(); 
  }

  function updateJumpBtns() {
    if (!D.tl || !D.jumpUpBtn || !D.jumpDownBtn) return;
    D.jumpUpBtn.disabled = D.tl.scrollTop <= 20;
    const acc = $("adminAccordion");
    const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 40;
    D.jumpDownBtn.disabled = D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance;
  }

  function insertMessageInOrder(el) {
    if (!D.tli) return;
    const ts = parseInt(el.dataset.ts || "0", 10);
    const mid = el.dataset.mid || "";
    const children = D.tli.children;
    let inserted = false;

    for (let i = children.length - 1; i >= 0; i--) {
      const child = children[i];
      const childTs = parseInt(child.dataset.ts || "0", 10);
      const childMid = child.dataset.mid || "";

      if (childTs < ts || (childTs === ts && childMid.localeCompare(mid) <= 0)) {
        D.tli.insertBefore(el, child.nextSibling);
        inserted = true;
        break;
      }
    }
    if (!inserted) {
      if (children.length > 0 && parseInt(children[0].dataset.ts || "0", 10) > ts) {
        D.tli.insertBefore(el, children[0]);
      } else {
        D.tli.appendChild(el);
      }
    }
  }

  async function syncSingleMessage(m, isNewIncoming = false) {
    if (!m || !m.id) return;

    if (m.cid && m.u === myUid && pendingSendMap.has(m.cid)) {
      const localId = pendingSendMap.get(m.cid);
      pendingSendMap.delete(m.cid);
      const el = renderedMwNodes.get(localId);
      if (el) {
        renderedMwNodes.delete(localId);
        displayedMsgIds.delete(localId);
        el.dataset.mid = m.id;
        el.classList.remove("is-pending", "is-failed");
        renderedMwNodes.set(m.id, el);
        displayedMsgIds.add(m.id);
        const msgTime = getMsgTime(m);
        el.dataset.ts = msgTime;
        if (msgTime > latestDisplayedTs) latestDisplayedTs = msgTime;
        const delBtn = el.querySelector(".msg-del-btn");
        if (delBtn) delBtn.dataset.mid = m.id;
      } else if (!displayedMsgIds.has(m.id)) {
        await decodeMsgPayload(m);
        const newEl = cMsg(m, isNewIncoming);
        insertMessageInOrder(newEl);
      }
      pruneOldMessages();
      updateJumpBtns();
      return;
    }

    if (displayedMsgIds.has(m.id) || processingMsgIds.has(m.id)) return;
    processingMsgIds.add(m.id);

    try {
      await decodeMsgPayload(m);

      const el = cMsg(m, isNewIncoming);
      insertMessageInOrder(el);
      pruneOldMessages();

      const msgTime = getMsgTime(m);
      const acc = $("adminAccordion");
      const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 80;
      const isAtBottom = D.tl && (D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance);

      if (!isFirstLoad && m.u !== myUid && m.u !== "system" && !m.sys && msgTime > latestDisplayedTs) {
        if (!isAtBottom) unreadMsgIds.add(m.id);
      }
      if (msgTime > latestDisplayedTs) latestDisplayedTs = msgTime;
      updateUnreadBadge();
      
      const isMine = (m.u === myUid && m.u !== "" && m.u !== "system");
      const shouldAutoScroll = isFirstLoad || isMine || (isNewIncoming && isAtBottom);

      if (shouldAutoScroll) {
        scBottom(true);
        if (isAtBottom || isMine) { unreadMsgIds.clear(); updateUnreadBadge(); }
      }
      updateJumpBtns();
    } finally {
      processingMsgIds.delete(m.id);
    }
  }

  function cMsg(m, isNewIncoming = false) {
    const el = document.createElement("div");
    const isMine = (m.u === myUid && m.u !== "" && m.u !== "system");
    el.className = "mw " + (isMine ? "is-mine" : "is-other") + (isNewIncoming ? " new-msg-anim" : "");
    el.setAttribute("data-mid", m.id);

    const msgTime = getMsgTime(m);
    el.dataset.ts = msgTime; el.dataset.rawMsg = m.m; el.dataset.uid = m.u || "";
    if (isNewIncoming) el.addEventListener("animationend", () => el.classList.remove("new-msg-anim"), { once: true });

    const isSys = m.sys === true || m.u === "system";
    if (isSys) {
      el.innerHTML = `<div class="sys-msg">${escapeHtml(m.m || "")}<span class="sys-ts">[${fDT(msgTime)}]</span></div>`;
      renderedMwNodes.set(m.id, el); displayedMsgIds.add(m.id);
      return el;
    }

    const officialPresenceUser = rawPresenceMap[m.u];
    const trip = (officialPresenceUser && officialPresenceUser.p) ? officialPresenceUser.p : (m.p || "");
    const name = m.n || "名無し";
    const color = m.c || "#f1f5f9";
    const isAdminForRoom = currentRoomId === "official" ? checkIsGlobalAdmin() : (myUid && myUid === roomSettings.creatorUid);
    const canDelete = isMine || isAdminForRoom;

    el.innerHTML = `
      <div class="mw-content-row">
        <div class="mm">
          <span class="mm-name" style="color:${color};">${escapeHtml(name)}</span>
          <span class="mm-trip" style="display:${trip ? 'inline' : 'none'};">${escapeHtml(trip)}</span>
        </div>
        <div class="mb-bubble"></div>
        <span class="ts">${fDT(msgTime)}</span>
        ${canDelete ? `<button class="msg-del-btn" data-mid="${m.id}" title="この発言を削除">🗑</button>` : ''}
      </div>
    `;
    
    const mbBubble = el.querySelector(".mb-bubble");
    
    if (m.m) {
      const text = m.m;
      const urls = text.match(UR);
      
      if (urls && urls.length > 0) {
        let lastIdx = 0;
        const regex = new RegExp(UR.source, "gi");
        let match;
        
        while ((match = regex.exec(text)) !== null) {
          const urlStr = match[0];
          const idx = match.index;
          
          if (idx > lastIdx) {
            const textSpan = document.createElement("span");
            textSpan.textContent = text.substring(lastIdx, idx);
            mbBubble.appendChild(textSpan);
          }
          
          const a = document.createElement("a");
          a.href = urlStr;
          a.textContent = urlStr;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.style.color = "#38bdf8";
          a.style.textDecoration = "underline";
          a.style.wordBreak = "break-all";
          a.addEventListener("click", (e) => { e.stopPropagation(); });
          mbBubble.appendChild(a);
          
          lastIdx = regex.lastIndex;
        }
        
        if (lastIdx < text.length) {
          const textSpan = document.createElement("span");
          textSpan.textContent = text.substring(lastIdx);
          mbBubble.appendChild(textSpan);
        }
      } else {
        const sp = document.createElement("span"); 
        sp.textContent = text; 
        mbBubble.appendChild(sp);
      }

      if (text.includes("http")) {
        const matches = text.match(UR);
        if (matches) matches.forEach(u => { const media = createMediaContainer(u); if (media) mbBubble.appendChild(media); });
      }
    }

    renderedMwNodes.set(m.id, el); displayedMsgIds.add(m.id);
    return el;
  }

  function createMediaContainer(url) {
    const cleanUrl = url.split(/[?#]/)[0];
    const ytId = getYoutubeId(url), nicoId = getNicoId(url);
    const isImg = /\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(cleanUrl);
    const isAudio = /\.(mp3|wav|ogg|m4a|flac)$/i.test(cleanUrl);
    if (!ytId && !nicoId && !isImg && !isAudio) return null;

    if (isImg) {
      const wrapper = document.createElement("div"); wrapper.style.marginTop = "6px";
      const img = document.createElement("img"); img.className = "inline-img"; img.src = url;
      img.loading = "lazy";
      img.onload = () => {
        const acc = $("adminAccordion");
        const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 80;
        const isAtBottom = D.tl && (D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance);
        if (isAtBottom) scBottom(true);
      };
      img.onclick = () => { if (D.imgViewSrc && D.imgViewMod) { D.imgViewSrc.src = url; resetZoom(); D.imgViewMod.classList.add("show"); } };
      wrapper.appendChild(img); return wrapper;
    }

    const container = document.createElement("div"); container.className = "media-link-container";
    const row = document.createElement("div"); row.className = "media-inline-row";
    const badge = document.createElement("span"); badge.className = "media-badge";
    const playBtn = document.createElement("button"); playBtn.className = "open-player-btn"; playBtn.textContent = "▶ 再生";

    if (ytId) { badge.textContent = "YouTube"; badge.style.background = "#ef4444"; playBtn.onclick = (e) => { e.preventDefault(); openFloatingPlayer(url, "youtube"); }; }
    else if (nicoId) { badge.textContent = "ニコニコ"; badge.style.background = "#2563eb"; playBtn.onclick = (e) => { e.preventDefault(); openFloatingPlayer(url, "niconico"); }; }
    else if (isAudio) { badge.textContent = "AUDIO"; badge.style.background = "#10b981"; playBtn.onclick = (e) => { e.preventDefault(); openFloatingPlayer(url, "audio"); }; }

    row.appendChild(badge); row.appendChild(playBtn); container.appendChild(row); return container;
  }

  function getYoutubeId(url) { const m = url ? url.match(/^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/|live\/)([^#\&\?]*).*/) : null; return (m && m[2].length === 11) ? m[2] : null; }
  function getNicoId(url) { const m = url ? url.match(/(sm\d+|so\d+|nm\d+|1\d+)/) : null; return m ? m[0] : null; }

  const closePlayer = () => {
    if (!D.fixedPlayer || !D.playerContent) return;
    const ae = D.playerContent.querySelector("audio"); if (ae) { ae.pause(); ae.src = ""; }
    D.fixedPlayer.style.display = "none"; D.playerContent.innerHTML = ""; updateJumpBtns();

  function openFloatingPlayer(url, type) {
    if (!D.fixedPlayer || !D.playerContent) return;
    D.fixedPlayer.style.display = "flex"; const titleEl = $("playerTitle");

      else if (type === "niconico" && nicoId) { titleEl.textContent = "📺 ニコニコ動画"; D.playerContent.style.aspectRatio = "16/9"; D.playerContent.innerHTML = `<iframe style="width:100%;height:100%;" src="https://embed.nicovideo.jp/watch/${nicoId}?jsapi=0&autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; }
    }
    updateJumpBtns();
  }

  function handlePresenceUpdate(rawList) {
    rawPresenceMap = rawList || {};
    const now = getTrueTime();
    const members = {};
    for (const [id, u] of Object.entries(rawPresenceMap)) {
      if (u && u.n && typeof u.t === "number" && (now - u.t < AUTO_EXIT_MS)) {
        members[id] = { id, ...u };
      }
    }
    currentPresenceMap = members;
    renderPresence(members);
  }

  function renderPresence(serverListMap) {
    if (!D.pl) return;
    const sorted = Object.values(serverListMap).filter(m => m && m.n).sort((a, b) => a.id.localeCompare(b.id));
    
    D.pl.style.display = sorted.length > 0 ? "flex" : "none";
    if ($("pcnt")) {
      const countStr = `${sorted.length}人`;
      if ($("pcnt").textContent !== countStr) {
        $("pcnt").textContent = countStr;
        $("pcnt").style.display = sorted.length > 0 ? "inline-block" : "none";
      }
    }

    const targetIds = new Set(sorted.map(m => m.id));
    Array.from(D.pl.children).forEach(chip => { 
      if (chip.dataset.uid && !targetIds.has(chip.dataset.uid)) chip.remove(); 
    });

    sorted.forEach(m => {
      const text = m.p ? `${m.n} ${m.p}` : m.n, color = m.c || "#f1f5f9";
      let chip = D.pl.querySelector(`[data-uid="${m.id}"]`);
      if (chip) {
        if (chip.textContent !== text) chip.textContent = text;
        if (chip.style.color !== color) { chip.style.color = color; chip.style.borderColor = color; }
      } else {
        chip = document.createElement("span"); 
        chip.className = "chip"; 
        chip.dataset.uid = m.id;
        chip.style.color = color; 
        chip.style.borderColor = color; 
        chip.textContent = text;
        const canBan = currentRoomId === "official" ? checkIsGlobalAdmin() : (myUid && myUid === roomSettings.creatorUid);
        if (canBan && m.id !== myUid) {
          chip.title = "このユーザーを追放(BAN)"; 
          chip.style.cursor = "pointer";
          chip.addEventListener("click", () => {
            customConfirm("メンバーのBAN", `ユーザー「${m.n}」を本当にこの部屋からBANしますか？`, "BANする", "キャンセル", true).then(ok => {
              if (ok) banUser(m.id, m.n, m.p || "");
            });
          });
        }
        D.pl.appendChild(chip);
      }
    });
    updateJumpBtns();
  }

  const banUser = function(targetUid, targetName, targetTrip) {
    const canBan = currentRoomId === "official" ? checkIsGlobalAdmin() : (myUid && myUid === roomSettings.creatorUid);
    if (!db || !canBan) return;
    db.ref(`banlist/${currentRoomId}/${targetUid}`).set({ n: targetName, p: targetTrip, t: firebase.database.ServerValue.TIMESTAMP }).then(() => {
      db.ref(`presence/${currentRoomId}/${targetUid}`).remove().catch(()=>{});
    });
  };

  const unbanUser = function(targetUid, targetName) {
    const canBan = currentRoomId === "official" ? checkIsGlobalAdmin() : (myUid && myUid === roomSettings.creatorUid);
    if (!db || !canBan) return;
    db.ref(`banlist/${currentRoomId}/${targetUid}`).remove().catch(() => {});
  };

  let presenceRef = null, settingsRef = null, banListRef = null, directChatQuery = null;

  async function syncServerOffset() {
    if (!db) return;
    try {
      const snap = await db.ref(".info/serverTimeOffset").once("value");
      serverTimeOffset = snap.val() || 0;
      isOffsetLoaded = true;
    } catch(e) {}
  }

  async function loadInitialRoomData() {
    if (!db || !isJoined || !currentRoomId) return;
    const roomId = currentRoomId;

    const incomingQueue = [];
    let isInitialRenderDone = false;

    if (directChatQuery) directChatQuery.off();
    directChatQuery = db.ref(`chat/${roomId}`).limitToLast(MAX_CHAT_LOGS);

    directChatQuery.on("child_added", async child => {
      const m = child.val();
      if (!m) return;
      m.id = child.key;
      if (!isInitialRenderDone) {
        incomingQueue.push(m);
      } else {
        await syncSingleMessage(m, true);
      }
    });

    directChatQuery.on("child_removed", child => {
      removeMessageElementWithAnim(child.key);
    });

    try {
      const [chatSnap, presSnap] = await Promise.all([
        db.ref(`chat/${roomId}`).limitToLast(MAX_CHAT_LOGS).once("value"),
        db.ref(`presence/${roomId}`).once("value"),
        syncServerOffset()
      ]);
      
      handlePresenceUpdate(presSnap.val() || {});
      checkAndTriggerExactAutoExit();

      const msgsMap = new Map();
      chatSnap.forEach(child => {
        const m = child.val();
        if (m) { m.id = child.key; msgsMap.set(m.id, m); }
      });

      incomingQueue.forEach(m => {
        if (!msgsMap.has(m.id)) msgsMap.set(m.id, m);
      });

      const msgs = Array.from(msgsMap.values());
      const resolvedMsgs = await Promise.all(msgs.map(m => decodeMsgPayload(m)));
      
      resolvedMsgs.sort((a, b) => {
        const timeDiff = getMsgTime(a) - getMsgTime(b);
        return timeDiff !== 0 ? timeDiff : a.id.localeCompare(b.id);
      });

      const fragment = document.createDocumentFragment();
      resolvedMsgs.forEach(m => {
        if (displayedMsgIds.has(m.id)) return;
        const el = cMsg(m, false);
        el.dataset.ts = getMsgTime(m);
        fragment.appendChild(el);
        displayedMsgIds.add(m.id);
        if (getMsgTime(m) > latestDisplayedTs) latestDisplayedTs = getMsgTime(m);
      });

      if (D.tli) D.tli.appendChild(fragment);
      pruneOldMessages();
      scBottom(true);
      updateJumpBtns();
    } catch (e) {
    } finally {
      isInitialRenderDone = true;
      isFirstLoad = false;
      const chatScr = $("chatScreen");
      if (chatScr) chatScr.classList.remove("is-loading");

      lastSyncAt = getTrueTime();

      if (incomingQueue.length > 0) {
        for (const m of incomingQueue) {
          if (!displayedMsgIds.has(m.id)) await syncSingleMessage(m, true);
        }
        incomingQueue.length = 0;
      }
    }
  }

  async function setupFirebaseListeners() {
    if (!db || !isJoined || isFirebaseListenersBound || !myUid) return;
    isFirebaseListenersBound = true;
    
    presenceRef = db.ref(`presence/${currentRoomId}`);
    settingsRef = db.ref(`settings/${currentRoomId}`);
    banListRef = db.ref(`banlist/${currentRoomId}`);
    presenceRef.off(); settingsRef.off(); banListRef.off();

    await loadInitialRoomData();

    presenceRef.on("value", s => {
      handlePresenceUpdate(s.val() || {});
    });

    let hasRoomEverConfirmed = false;
    settingsRef.on("value", snap => {
      if (snap.exists()) {
        hasRoomEverConfirmed = true;
      } else if (hasRoomEverConfirmed && isJoined && currentRoomId !== "official") {
        doExit(false, false);
        return;
      }
      const val = snap.val() || {};
      roomSettings.newEntriesDisabled = val.newEntriesDisabled || false;
      roomSettings.passcode = val.passcode || "";
      roomSettings.approvedTrips = val.approvedTrips || {};
      roomSettings.creatorUid = val.creatorUid || "";
      renderApprovedTripsList(roomSettings.approvedTrips);

      const serverClearTime = val.last_cleared_at || 0;
      if (serverClearTime && serverClearTime > localLastClearedTime) {
        localLastClearedTime = serverClearTime;
        clearChatUIOnly();
        latestDisplayedTs = serverClearTime;
      }
      applyRoomSettingsUI();
      renderCallBar();
      injectAdminUIIfNeeded();
    });

    banListRef.on("value", snap => {
      renderBanList(snap.val() || {});
    });

    myPresenceRef = db.ref(`presence/${currentRoomId}/${myUid}`);
    let hasPresenceEverExisted = false;
    myPresenceRef.on("value", s => {
      if (!isJoined || isExecutingAutoExit) return;
      if (s.exists()) {
        hasPresenceEverExisted = true;
        const val = s.val();
        if (val && typeof val.t === "number") {
          myLastActiveTs = val.t;
          safeLS.set("nz_last_post_time", val.t.toString());
        }
      } else if (hasPresenceEverExisted) {
        doExit(true, false);
      }
    });
  }

  function detachFirebaseListeners() {
    if (directChatQuery) { directChatQuery.off(); directChatQuery = null; }
    if (db && currentRoomId) {
      db.ref(`settings/${currentRoomId}`).off("value");
      db.ref(`banlist/${currentRoomId}`).off("value");
    }
    if (myPresenceRef) { myPresenceRef.off("value"); myPresenceRef = null; }
    if (presenceRef) { presenceRef.off("value"); presenceRef = null; }
    isFirebaseListenersBound = false;
  }

  function applyRoomSettingsUI() {
    const badgesContainer = $("roomStatusBadges");
    if (badgesContainer) {
      badgesContainer.innerHTML = ""; let count = 0;
      if (roomSettings.passcode) { badgesContainer.innerHTML += `<span style="font-size:9.5px;font-weight:900;background:#fb923c;color:#fff;padding:1.5px 5px;border-radius:3px;">🔑合言葉</span>`; count++; }
      if (roomSettings.newEntriesDisabled) { badgesContainer.innerHTML += `<span style="font-size:9.5px;font-weight:900;background:#64748b;color:#fff;padding:1.5px 5px;border-radius:3px;">🚫制限</span>`; count++; }
      badgesContainer.style.display = count > 0 ? "flex" : "none";
    }
    injectAdminUIIfNeeded();
    const isHost = (currentRoomId && currentRoomId !== "official" && myUid && myUid === roomSettings.creatorUid);
    const isGlobal = checkIsGlobalAdmin();
    if (currentRoomId === "official") {
      if ($("admDestroyRoomContainer")) $("admDestroyRoomContainer").style.display = "none";
      if ($("admClearChatContainer")) $("admClearChatContainer").style.display = isGlobal ? "flex" : "none";
    } else {
      if ($("admDestroyRoomContainer")) $("admDestroyRoomContainer").style.display = isHost ? "flex" : "none";
      if ($("admClearChatContainer")) $("admClearChatContainer").style.display = isHost ? "flex" : "none";
    }
  }

  function updateAdminAccordionFields() {
    const isOfficial = (currentRoomId === "official");
    if ($("adminAccordionTitle")) $("adminAccordionTitle").textContent = isOfficial ? "⚙️ 公式部屋 管理パネル" : "⚙️ ホスト設定パネル";
    if ($("admGeneralSettingsGroup")) $("admGeneralSettingsGroup").style.display = "flex";
    if ($("admStopJoin")) $("admStopJoin").checked = roomSettings.newEntriesDisabled;
    if ($("admPassToggle")) $("admPassToggle").checked = !!roomSettings.passcode;
    if ($("admPass")) $("admPass").value = roomSettings.passcode || "";
    if ($("admPassContainer")) $("admPassContainer").style.display = roomSettings.passcode ? "flex" : "none";
    renderApprovedTripsList(roomSettings.approvedTrips);
  }

  async function clearAllMessages() {
    const canManage = currentRoomId === "official" ? checkIsGlobalAdmin() : (myUid && myUid === roomSettings.creatorUid);
    if (!db || !currentRoomId || !canManage) return;
    try {
      const clearTs = getTrueTime();
      await db.ref(`settings/${currentRoomId}/last_cleared_at`).set(clearTs);
      await db.ref(`chat/${currentRoomId}`).remove();
      localLastClearedTime = clearTs;
      clearChatUIOnly();
    } catch (e) {}
  }

  // ⚡ メッセージ送信
  let lastSendAt = 0;
  function sendMessage() {
    if (!isJoined || !db) return;
    const text = D.mi.value.trim();
    if (!text) return;
    const nowClick = Date.now();
    if (nowClick - lastSendAt < 250) return;
    lastSendAt = nowClick;

    const cid = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const keepOpen = D.kbKeepOpenChk && D.kbKeepOpenChk.checked;
    D.mi.value = ""; updateClrMsgBtnVisibility(); D.mi.style.height = "auto";
    if (keepOpen) D.mi.focus(); else D.mi.blur();

    const localTs = getTrueTime();
    const localId = "local_" + cid;
    const localMsg = { id: localId, u: myUid, n: myName || "名無し", p: myTrip, c: curColor, m: text, t: localTs };

    pendingSendMap.set(cid, localId);
    const localEl = cMsg(localMsg, true);
    localEl.classList.add("is-pending");
    insertMessageInOrder(localEl);
    pruneOldMessages();
    scBottom(true);
    unreadMsgIds.clear(); updateUnreadBadge();
    updateJumpBtns();

    (async () => {
      try {
        await ensureAnonAuth().catch(()=>{});
        if (!myUid) {
          myUid = (auth.currentUser && auth.currentUser.uid) || safeLS.get("nz_permanent_uid");
        }

        const trueNow = getTrueTime();
        updateLastPostTime(trueNow);

        const encD = await encodeMsgPayload(myName || "名無し", myTrip, text);
        const postTs = firebase.database.ServerValue.TIMESTAMP;
        
        const newMsgRef = db.ref(`chat/${currentRoomId}`).push();
        await newMsgRef.set({ u: myUid, c: curColor, t: postTs, cid, d: encD });
        
        db.ref(`presence/${currentRoomId}/${myUid}/t`).set(postTs).catch(()=>{});

      } catch (e) {
        console.error("メッセージ送信エラー詳細:", e);
        const el = renderedMwNodes.get(localId);
        if (el) {
          el.classList.remove("is-pending");
          el.classList.add("is-failed");
          const bubble = el.querySelector(".mb-bubble");
          if (bubble) bubble.innerHTML += `<span style="color:var(--ro);font-size:10px;display:block;margin-top:2px;">⚠️ 送信失敗 (接続を確認してください)</span>`;
        }
        showToast("⚠️ 送信に失敗しました");
      }
    })();
  }

  const initDirectDatabaseProcess = async () => {
    try {
      if (db) db.goOnline();
      ensureAnonAuth().catch(()=>{});
      await syncProfileValues();

      const offsetPromise = syncServerOffset().catch(() => {});

      const wasJoined = !inviteRoomId && safeLS.get("nz_is_joined") === "true";
      const lastRoomId = safeLS.get("nz_last_room_id");
      const lastRoomPass = safeLS.get("nz_last_room_pass");
      const sessionStart = parseInt(safeLS.get("nz_session_start_time") || "0");
      const lastPost = parseInt(safeLS.get("nz_last_post_time") || "0");
      const baselineTime = Math.max(sessionStart, lastPost);
      const nowTrue = Date.now();

      if (wasJoined && lastRoomId && (lastRoomId === "official" || lastRoomPass) && (nowTrue - baselineTime < AUTO_EXIT_MS)) {
        await offsetPromise;
        joinRoom({ roomId: lastRoomId, roomPass: lastRoomPass, silent: true, isCrossTab: true });
      } else {
        switchScreen("lobby");
      }
      validateLobbyInputs();

      await offsetPromise;
      broadcastTabSync("REQUEST_STATE");
    } catch (err) {
      switchScreen("lobby");
    }

    if (!isConnectedBound && db) {
      db.ref(".info/serverTimeOffset").on("value", snap => {
        serverTimeOffset = snap.val() || 0;
        isOffsetLoaded = true;
      });

      let hasDisconnectedOnce = false;
      db.ref(".info/connected").on("value", snap => {
        const nowConnected = snap.val() === true;
        if (nowConnected) {
          if (hasDisconnectedOnce) {
            syncIncrementalDiff();
            hasDisconnectedOnce = false;
          }
        } else {
          hasDisconnectedOnce = true;
        }
      });

      db.ref("globalSettings/autoExitMinutes").on("value", snap => {
        const val = snap.val();
        if (val) {
          autoExitMinutes = parseInt(val, 10);
          safeLS.set("nz_auto_exit_minutes", autoExitMinutes.toString());
          AUTO_EXIT_MS = autoExitMinutes * 60 * 1000;
          if ($("lobbyAutoExitSelect")) $("lobbyAutoExitSelect").value = autoExitMinutes;
        }
      });

      db.ref("globalSettings/callsDisabled").on("value", snap => {
        globalCallsDisabled = snap.val() === true;
        if (globalCallsDisabled && callState.active) {
          leaveCall();
        }
        renderCallBar();
        if ($("lobbyCallsToggle")) $("lobbyCallsToggle").checked = globalCallsDisabled;
      });

      isConnectedBound = true;
    }
  };

  function handleCrossTabSync(data) {
    if (!data || data.senderTabId === tabSyncId) return;

    if (data.action === "REQUEST_STATE") {
      broadcastTabSync("RESPOND_STATE", {
        isJoined: isJoined,
        screen: safeLS.get("nz_current_screen") || "lobby",
        roomId: safeLS.get("nz_last_room_id") || "",
        roomPass: safeLS.get("nz_last_room_pass") || ""
      });
    } else if (data.action === "RESPOND_STATE") {
      const { isJoined: remoteJoined, screen, roomId, roomPass } = data.payload || {};
      if (remoteJoined && roomId) {
        if (!isJoined || safeLS.get("nz_last_room_id") !== roomId) {
          joinRoom({ roomId, roomPass, silent: true, isCrossTab: true });
        }
      } else if (screen === "lobby" && isJoined) {
        doExit(false, true);
      }
    } else if (data.action === "ROOM_JOIN") {
      const { roomId, roomPass } = data.payload || {};
      if (roomId && (!isJoined || safeLS.get("nz_last_room_id") !== roomId)) {
        joinRoom({ roomId, roomPass, silent: true, isCrossTab: true });
      }
    } else if (data.action === "ROOM_EXIT") {
      if (isJoined) {
        doExit(data.payload ? data.payload.isAuto : false, true);
      }
    } else if (data.action === "PROFILE_UPDATE") {
      syncProfileValues();
    }
  }

  if (tabChannel) tabChannel.onmessage = e => handleCrossTabSync(e.data);
  window.addEventListener("storage", e => {
    if (e.key === "nz_tab_broadcast" && e.newValue) {
      try { handleCrossTabSync(JSON.parse(e.newValue)); } catch(err){}
    }
    if (e.key === "nz_current_screen") {
      if (e.newValue === "lobby" && isJoined) doExit(false, true);
    }
  });

  function initApp() {
    D = {
      joinBtn: $("btnJoin"), sdBtn: $("sdBtn"), ib: $("ib"), exBtn: $("exBtn"),
      clrBtn: $("clrBtn"), fixedPlayer: $("fixedPlayer"), playerCloseBtn: $("playerCloseBtn"),
      playerContent: $("playerContent"), tl: $("tl"), tli: $("tl-inner"), unreadBadge: $("unreadBadge"),
      jumpUpBtn: $("jumpUpBtn"), jumpDownBtn: $("jumpDownBtn"), clrMsgBtn: $("clrMsgBtn"),
      clrmod: $("clrmod"), imgViewMod: $("imgViewMod"), imgViewSrc: $("imgViewSrc"),
      imgViewCloseBtn: $("imgViewCloseBtn"), clrCancel: $("clrCancel"), clrOk: $("clrOk"),
      clrPick2: $("clrPick2"), clrPrev: $("clrPrev"), pcnt: $("pcnt"), pl: $("pl"),
      mi: $("mi"), kbKeepOpenChk: $("kbKeepOpenChk"), clrDot: $("clrDot")
    };

    if (window.__PRELOAD_ROOM_ID__) {
      const pRoom = window.__PRELOAD_ROOM_ID__;
      const logoTitle = $("logoTitle") || document.querySelector(".logo");
      if (logoTitle) {
        logoTitle.innerHTML = `NEZUO CHAT<span class="sub-room">${pRoom === "official" ? "常設公式部屋" : escapeHtml(pRoom)}</span>`;
      }
      if ($("exBtn")) $("exBtn").style.display = "inline-flex";
      if ($("inviteBtn")) $("inviteBtn").style.display = (pRoom === "official") ? "none" : "inline-flex";
    }

    const autoExitSel = $("lobbyAutoExitSelect");
    if (autoExitSel) {
      autoExitSel.innerHTML = "";
      for (let m = 1; m <= 120; m++) {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = `${m} 分`;
        if (m === autoExitMinutes) opt.selected = true;
        autoExitSel.appendChild(opt);
      }
      autoExitSel.addEventListener("change", async () => {
        if (!checkIsGlobalAdmin() || !db) return;
        const val = parseInt(autoExitSel.value, 10);
        await ensureAnonAuth().catch(()=>{});
        db.ref("globalSettings/autoExitMinutes").set(val).catch(() => {});
      });
    }

    buildPicker($("lobbyColorGrid"), curColor, "clrc2", (v) => {
      curColor = v; setGlobalColor(curColor); safeLS.set("nz_color", curColor);
      $("lobbyColorGrid").querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.color === v));
      syncProfileValues();
      broadcastTabSync("PROFILE_UPDATE");
    });
    buildPicker(D.clrPick2, tmpColor, "clrc2", (v) => {
      tmpColor = v; D.clrPick2.querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.color === v));
      updateModalColorPreview(v);
    });

    if (D.clrBtn) D.clrBtn.addEventListener("click", (e) => { e.preventDefault(); tmpColor = curColor; updateModalColorPreview(tmpColor); D.clrmod.classList.add("show"); });
    if (D.clrCancel) D.clrCancel.addEventListener("click", (e) => { e.preventDefault(); D.clrmod.classList.remove("show"); });
    if (D.clrOk) D.clrOk.addEventListener("click", (e) => {
      e.preventDefault(); curColor = tmpColor; setGlobalColor(curColor); safeLS.set("nz_color", curColor);
      if (D.clrDot) D.clrDot.style.background = curColor; D.clrmod.classList.remove("show");
      broadcastTabSync("PROFILE_UPDATE");
      if (isJoined && db && myUid && currentRoomId) {
        db.ref(`presence/${currentRoomId}/${myUid}/c`).set(curColor).catch(() => {});
      }
    });

    if (D.exBtn) D.exBtn.addEventListener("click", (e) => { e.preventDefault(); customConfirm("退室確認", "本当にこの部屋から退室しますか？", "退室する", "キャンセル", true).then(ok => { if (ok) doExit(false); }); });
    if (D.sdBtn) D.sdBtn.addEventListener("click", (e) => { e.preventDefault(); sendMessage(); });

    if ($("callBtn")) $("callBtn").addEventListener("click", (e) => { e.preventDefault(); if ($("callModeMod")) $("callModeMod").classList.add("show"); });
    if ($("callModeCancelBtn")) $("callModeCancelBtn").addEventListener("click", (e) => { e.preventDefault(); if ($("callModeMod")) $("callModeMod").classList.remove("show"); });
    if ($("callJoinBothBtn")) $("callJoinBothBtn").addEventListener("click", (e) => { e.preventDefault(); if ($("callModeMod")) $("callModeMod").classList.remove("show"); startCall("both"); });
    if ($("callJoinListenBtn")) $("callJoinListenBtn").addEventListener("click", (e) => { e.preventDefault(); if ($("callModeMod")) $("callModeMod").classList.remove("show"); startCall("listen"); });
    
    if ($("callSwitchModeBtn")) $("callSwitchModeBtn").addEventListener("click", (e) => { e.preventDefault(); switchCallMode(); });
    if ($("callMuteBtn")) $("callMuteBtn").addEventListener("click", (e) => { e.preventDefault(); toggleMute(); });
    
    if ($("callLeaveBtn")) $("callLeaveBtn").addEventListener("click", (e) => {
      e.preventDefault();
      customConfirm("通話終了の確認", "通話を終了しますか？（チャット部屋自体は継続します）", "通話を終了", "キャンセル", true).then(ok => { if (ok) leaveCall(); });
    });

    // 🗑 発言削除のイベント委譲
    if (D.tl) {
      D.tl.addEventListener("click", (e) => {
        const delBtn = e.target.closest(".msg-del-btn");
        if (!delBtn) return;
        e.preventDefault();
        const mid = delBtn.dataset.mid;
        if (!mid || !db || !currentRoomId) return;
        customConfirm("メッセージ削除", "この発言を削除しますか？", "削除する", "キャンセル", true).then(ok => {
          if (ok) {
            db.ref(`chat/${currentRoomId}/${mid}`).remove().catch(err => {
              showToast("⚠️ 削除に失敗しました");
            });
          }
        });
      });
    }

    if (D.mi) {
      D.mi.addEventListener("input", () => { updateClrMsgBtnVisibility(); D.mi.style.height = "auto"; D.mi.style.height = Math.min(D.mi.scrollHeight, 120) + "px"; });
      D.mi.addEventListener("focus", () => { setTimeout(() => scBottom(true), 50); });
      D.mi.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter" && !e.shiftKey) {
          const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          if (isMobile || !e.ctrlKey && !e.metaKey) { e.preventDefault(); sendMessage(); }
        }
      });
    }

    if (typeof window !== 'undefined') {
      const appEl = $("app");
      let lastHeight = window.innerHeight;
      let rafPending = false;
      function syncViewportToKeyboard() {
        if (rafPending) return;
        rafPending = true;
        const acc = $("adminAccordion");
        const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 80;
        const wasAtBottom = D.tl && (D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance);
        requestAnimationFrame(() => {
          rafPending = false;
          if (appEl && window.visualViewport) {
            const vv = window.visualViewport;
            appEl.style.height = vv.height + "px";
            appEl.style.top = vv.offsetTop + "px";
            window.scrollTo(0, 0);
          }
          if (isJoined && wasAtBottom) scBottom(true);
        });
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportToKeyboard);
        window.visualViewport.addEventListener('scroll', syncViewportToKeyboard);
        syncViewportToKeyboard();
      }

      window.addEventListener('resize', () => {
        const currentHeight = window.innerHeight;
        if (Math.abs(lastHeight - currentHeight) > 100) {
          lastHeight = currentHeight;
          const acc = $("adminAccordion");
          const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 80;
          const wasAtBottom = D.tl && (D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance);
          if (isJoined && wasAtBottom) setTimeout(() => scBottom(true), 80);
        }
      });
    }

    if (D.clrMsgBtn && D.mi) D.clrMsgBtn.addEventListener("click", (e) => { e.preventDefault(); D.mi.value = ""; updateClrMsgBtnVisibility(); D.mi.style.height = "auto"; D.mi.focus(); });
    if (D.playerCloseBtn) D.playerCloseBtn.addEventListener("click", (e) => { e.preventDefault(); closePlayer(); });

    if (D.tl) {
      D.tl.addEventListener("scroll", () => {
        const acc = $("adminAccordion");
        const bottomTolerance = (acc && acc.style.display === "flex") ? 130 : 80;
        const isAtBottom = D.tl.scrollHeight - (D.tl.scrollTop + D.tl.clientHeight) <= bottomTolerance;
        if (isAtBottom) { unreadMsgIds.clear(); updateUnreadBadge(); }
        updateJumpBtns();
      });
    }

    if (D.jumpUpBtn) D.jumpUpBtn.addEventListener("click", (e) => { e.preventDefault(); if (D.tl) D.tl.scrollTo({ top: 0, behavior: "smooth" }); });
    if (D.jumpDownBtn) D.jumpDownBtn.addEventListener("click", (e) => { 
      e.preventDefault(); 
      scBottom(true);
      unreadMsgIds.clear(); updateUnreadBadge(); 
    });

    if (D.imgViewCloseBtn && D.imgViewMod) D.imgViewCloseBtn.addEventListener("click", (e) => { e.preventDefault(); D.imgViewMod.classList.remove("show"); });

    $("btnCopyTrip").addEventListener("click", async (e) => {
      e.preventDefault();
      if (!myTrip) { showToast("⚠️ トリップが生成されていません"); return; }
      try { await navigator.clipboard.writeText(myTrip); showToast(`📋 トリップ「${myTrip}」をコピーしました`); } catch(err) { showToast("⚠️ コピーに失敗しました"); }
    });

    $("btnGen").addEventListener("click", (e) => {
      e.preventDefault();
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let randId = "rm-", randPass = "";
      const randVals1 = new Uint8Array(8), randVals2 = new Uint8Array(12);
      if (typeof window !== 'undefined' && window.crypto) {
        window.crypto.getRandomValues(randVals1); window.crypto.getRandomValues(randVals2);
        for (let i = 0; i < 8; i++) randId += chars[randVals1[i] % chars.length];
        for (let i = 0; i < 12; i++) randPass += chars[randVals2[i] % chars.length];
      } else {
        for (let i = 0; i < 8; i++) randId += chars[Math.floor(Math.random() * chars.length)];
        for (let i = 0; i < 12; i++) randPass += chars[Math.floor(Math.random() * chars.length)];
      }
      $("lobbyRoomId").value = randId; $("lobbyRoomPass").value = randPass;
      showToast("🎲 部屋IDとパスワードを生成しました");
      validateLobbyInputs();
    });

    $("inviteBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      const rawParam = `r=${encodeURIComponent(safeLS.get("nz_last_room_id"))}&p=${encodeURIComponent(safeLS.get("nz_last_room_pass"))}`;
      const inviteUrl = window.location.origin + window.location.pathname + "#" + btoa(unescape(encodeURIComponent(rawParam)));
      try { await navigator.clipboard.writeText(inviteUrl); showToast("🔗 招待URLをコピーしました"); } catch(err) { alert("コピーに失敗しました：\n" + inviteUrl); }
    });

    D.joinBtn.addEventListener("click", (e) => { e.preventDefault(); joinRoom(); });
    $("btnJoinOfficial").addEventListener("click", (e) => { e.preventDefault(); joinRoom({ roomId: "official", roomPass: "" }); });

    if ($("lobbyCallsToggle")) $("lobbyCallsToggle").addEventListener("change", async () => {
      if (!checkIsGlobalAdmin() || !db) return;
      const checkedNow = $("lobbyCallsToggle").checked;
      await ensureAnonAuth().catch(()=>{});
      db.ref("globalSettings/callsDisabled").set(checkedNow).catch((err) => {
        $("lobbyCallsToggle").checked = !checkedNow;
      });
    });

    $("lobbyName").addEventListener("input", () => {
      let cleanVal = $("lobbyName").value.replace(/◆/g, "");
      $("lobbyName").value = cleanVal; safeLS.set("nz_ni", cleanVal); syncProfileValues();
      broadcastTabSync("PROFILE_UPDATE");
    });

    $("lobbyRoomId").addEventListener("input", validateLobbyInputs);
    $("lobbyRoomPass").addEventListener("input", validateLobbyInputs);
    if ($("lobbyName")) $("lobbyName").value = safeLS.get("nz_ni") || "";
    syncProfileValues();

    if (inviteRoomId) {
      if ($("lobbyRoomId")) $("lobbyRoomId").value = inviteRoomId;
      if ($("lobbyRoomPass")) $("lobbyRoomPass").value = inviteRoomPass;
      history.replaceState(null, "", window.location.pathname + window.location.search);
      validateLobbyInputs();
    }

    initDirectDatabaseProcess();
  }

  initApp();
 } catch (fatalErr) {
   console.error("NEZUO CHAT fatal init error:", fatalErr);
   document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#05070a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;text-align:center;line-height:1.6;font-size:14px;">⚠️ 読み込みに失敗しました。<br>再読み込みしてください。</div>';
 }
})();
</script>
</body>
</html>
